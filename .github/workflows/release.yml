name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Attach release asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The Marketplace treats the release tag as the installed version, so it has to match
      # the manifest or users are offered a version that doesn't match what they get.
      - name: Check the tag matches the manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(jq -r '.version' custom_components/neosmartblinds/manifest.json)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match manifest version '$version'"
            exit 1
          fi

      # Optional convenience for manual installs; the Marketplace installs from the tag itself.
      - name: Create zip asset
        run: |
          cd custom_components/neosmartblinds
          zip -r ../../neosmartblinds.zip .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: neosmartblinds.zip
